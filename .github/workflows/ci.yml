name: Python Syntax Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile app.py
          python -m py_compile api/index.py
          python -m py_compile config.py
          python -m py_compile database/db.py
          python -m py_compile services/ai_service.py
          python -m py_compile services/caption_service.py
          python -m py_compile routes/auth.py
          python -m py_compile routes/captions.py
          python -m py_compile routes/dashboard.py
          echo "All Python files passed syntax check"

      - name: Validate templates
        run: |
          python -c "
          import os
          from jinja2 import Environment, FileSystemLoader, TemplateSyntaxError
          env = Environment(loader=FileSystemLoader('templates'))
          errors = []
          for f in os.listdir('templates'):
              if f.endswith('.html'):
                  try:
                      env.parse(open('templates/' + f).read())
                  except TemplateSyntaxError as e:
                      errors.append((f, str(e)))
          if errors:
              for f, e in errors: print('ERROR:', f, e)
              exit(1)
          print('All', len([f for f in os.listdir('templates') if f.endswith('.html')]), 'templates OK')
          "
