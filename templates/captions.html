{% extends "dashboard_base.html" %}
{% block title %}My Captions{% endblock %}
{% block topbar_title %}My Captions{% endblock %}

{% block content %}
<div class="page-header">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
    <div>
      <h1>📌 My Captions</h1>
      <p>Browse, search, edit and manage all your captions.</p>
    </div>
    <a href="/generate" class="btn btn-primary"><i class="bi bi-stars"></i> Generate New</a>
  </div>
</div>

<!-- Tabs -->
<div style="display:flex;gap:4px;margin-bottom:20px;background:var(--bg-secondary);padding:4px;border-radius:12px;width:fit-content;border:1px solid var(--border);">
  <button class="btn btn-primary btn-sm" id="tab-saved" onclick="switchTab('saved')">
    <i class="bi bi-bookmark-fill"></i> Saved
  </button>
  <button class="btn btn-ghost btn-sm" id="tab-all" onclick="switchTab('all')">
    <i class="bi bi-clock-history"></i> All History
  </button>
</div>

<!-- Filter Bar -->
<div class="filter-bar">
  <div class="search-box">
    <i class="bi bi-search" style="color:var(--text-muted)"></i>
    <input type="text" id="search-input" placeholder="Search captions...">
  </div>
  <select class="form-select" id="platform-filter" style="width:auto;min-width:150px;">
    <option value="">All Platforms</option>
    {% for p in platforms %}
    <option value="{{ p }}">{{ p }}</option>
    {% endfor %}
  </select>
  <select class="form-select" id="category-filter" style="width:auto;min-width:150px;">
    <option value="">All Categories</option>
    {% for c in categories %}
    <option value="{{ c }}">{{ c }}</option>
    {% endfor %}
  </select>
</div>

<!-- Captions Grid -->
<div class="grid-auto" id="captions-grid">
  <div class="loading-overlay">
    <div class="spinner spinner-primary"></div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  let currentTab = 'saved';

  function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tab-saved').className = tab === 'saved' ? 'btn btn-primary btn-sm' : 'btn btn-ghost btn-sm';
    document.getElementById('tab-all').className = tab === 'all' ? 'btn btn-primary btn-sm' : 'btn btn-ghost btn-sm';
    CaptionsPage.filters.saved = tab === 'saved' ? 1 : null;
    CaptionsPage.load();
  }

  // Start with saved captions
  CaptionsPage.filters.saved = 1;
</script>
{% endblock %}
